name: Navigation integrity

on:
  push:
    paths:
      - 'index.html'
      - 'AGENTS.md'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/navigation.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'AGENTS.md'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/navigation.yml'

permissions:
  contents: read

jobs:
  verify-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Navigation must match physical document order
        run: python scripts/sync_navigation.py --check
      - name: Positive and negative regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
